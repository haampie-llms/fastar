name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: python tests/vendor/fetch_cpython_testdata.py cpython-testdata
      - run: pytest -rs
        env:
          UNTAR_CPYTHON_TESTDATA: cpython-testdata

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheel
          path: dist/

  # Spack still supports Python 3.6, for which hatchling and hypothesis are too new: test the
  # wheel built above, which also checks that old pip installs it.
  test-old:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.7"]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheel
          path: dist/
      - run: pip install pytest dist/*.whl
      - run: python tests/vendor/fetch_cpython_testdata.py cpython-testdata
      - run: rm untar.py && pytest -rs
        env:
          UNTAR_CPYTHON_TESTDATA: cpython-testdata

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]'
      - run: ruff check
      - run: ruff format --diff
      - run: mypy
